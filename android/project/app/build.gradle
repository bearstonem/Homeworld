apply plugin: 'com.android.application'

android {
    namespace "org.gardensofkadesh.homeworld"
    compileSdkVersion 34
    defaultConfig {
        applicationId "org.gardensofkadesh.homeworld"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.2.0"
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions "mode"
    productFlavors {
        // Regular Android app (also runs on Quest as a 2D panel)
        flat {
            dimension "mode"
        }
        // Immersive Meta Quest app: OpenXR theater mode via gl4es
        vr {
            dimension "mode"
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }
    sourceSets {
        // The 1.05 demo assets ride in the VR APK so it is playable without
        // owning Homeworld; HomeworldActivity unpacks them on first run. They
        // are referenced where meson already put them rather than copied into
        // the repository, which would be 65 MB of duplicated binaries in git.
        vr {
            assets.srcDirs += ['../../../subprojects/demo-assets-1.05/assets']
            // The multiplayer loading screen. The game data carries no
            // ScreenShots/ShotList.script, so without this the background
            // would simply be absent.
            assets.srcDirs += ['../../../dist/assets']
        }
    }
    androidResources {
        // Unpacking is a straight copy this way instead of an inflate, and
        // these are already compressed formats - zipping them buys a couple of
        // percent and costs seconds on first launch.
        noCompress += ['big', 'wxd', 'vce']
    }
    lint {
        abortOnError false
    }
}

// The demo assets come from a meson wrap (subprojects/demo-assets.wrap), so a
// tree that has only ever been configured for a non-emscripten target may not
// have them yet. Without this the VR APK builds happily and then finds nothing
// to unpack on the headset, which looks like a bug in the app.
tasks.matching { it.name ==~ /(?i)merge.*Vr.*Assets/ }.configureEach {
    doFirst {
        def assets = file("${projectDir}/../../../subprojects/demo-assets-1.05/assets")
        if (!assets.isDirectory()) {
            throw new GradleException(
                "Demo assets missing at ${assets}.\n" +
                "Fetch them with: meson subprojects download demo-assets")
        }
    }
}

// The native libraries (libSDL2.so, libmain.so) are prebuilt outside gradle:
// SDL2 via CMake+NDK and the game via the meson cross file (see
// android/README.md). They are picked up from app/src/main/jniLibs/arm64-v8a/.
