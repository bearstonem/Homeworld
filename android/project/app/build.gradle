apply plugin: 'com.android.application'

/* The port's version is declared once, in src/SDL/main.h, because that is what
   the game itself puts on screen. It is read here rather than written out a
   second time: two copies, in two languages, in two directories, drift - and
   this particular drift is silent. A sideloader compares versionCode and
   nothing else to decide a build is newer, so an APK that never changes it
   simply stops offering updates rather than reporting anything wrong. That is
   what shipped for seven releases before anyone looked. */
def unboundHeader = new File(rootDir, "../../src/SDL/main.h")
if (!unboundHeader.isFile()) {
    throw new GradleException(
        "Cannot read ${unboundHeader.canonicalPath}. The APK version comes from " +
        "HW_UNBOUND_VERSION there and must not be guessed.")
}
def unboundMatch = (unboundHeader.text =~ /define\s+HW_UNBOUND_VERSION\s+"([^"]+)"/)
if (!unboundMatch) {
    throw new GradleException(
        "HW_UNBOUND_VERSION is not defined in ${unboundHeader.canonicalPath}, " +
        "so the APK has no version to declare.")
}
def unboundVersionName = unboundMatch[0][1]
def unboundParts = unboundVersionName.tokenize('.')
if (unboundParts.size() != 2 || !unboundParts.every { it.isInteger() }) {
    throw new GradleException(
        "HW_UNBOUND_VERSION is '${unboundVersionName}', which is not major.minor, " +
        "so no version code can be derived from it.")
}
/* major*100 + minor: always increases, never collides, and leaves room for a
   minor to reach 99. 0.7 -> 7, 0.10 -> 10, 1.0 -> 100. */
def unboundVersionCode = unboundParts[0].toInteger() * 100 + unboundParts[1].toInteger()

android {
    namespace "org.homeworldunbound.game"
    compileSdkVersion 34
    defaultConfig {
        applicationId "org.homeworldunbound.game"
        minSdkVersion 26
        targetSdkVersion 34
        // Both derived from HW_UNBOUND_VERSION above, so bumping that one line
        // for a release is enough and nothing here can fall behind it. The
        // engine version this is built on is minorBuildVersion in the same
        // header, and moves with upstream instead.
        versionCode unboundVersionCode
        versionName unboundVersionName
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions "mode"
    productFlavors {
        // Regular Android app (also runs on Quest as a 2D panel)
        flat {
            dimension "mode"
        }
        // Immersive Meta Quest app: OpenXR theater mode via gl4es
        vr {
            dimension "mode"
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }
    sourceSets {
        // The 1.05 demo assets ride in the VR APK so it is playable without
        // owning Homeworld; HomeworldActivity unpacks them on first run. They
        // are referenced where meson already put them rather than copied into
        // the repository, which would be 65 MB of duplicated binaries in git.
        vr {
            assets.srcDirs += ['../../../subprojects/demo-assets-1.05/assets']
            // The multiplayer loading screen. The game data carries no
            // ScreenShots/ShotList.script, so without this the background
            // would simply be absent.
            assets.srcDirs += ['../../../dist/assets']
        }
    }
    androidResources {
        // Unpacking is a straight copy this way instead of an inflate, and
        // these are already compressed formats - zipping them buys a couple of
        // percent and costs seconds on first launch.
        noCompress += ['big', 'wxd', 'vce']
    }
    lint {
        abortOnError false
    }
}

// The demo assets come from a meson wrap (subprojects/demo-assets.wrap), so a
// tree that has only ever been configured for a non-emscripten target may not
// have them yet. Without this the VR APK builds happily and then finds nothing
// to unpack on the headset, which looks like a bug in the app.
tasks.matching { it.name ==~ /(?i)merge.*Vr.*Assets/ }.configureEach {
    doFirst {
        def assets = file("${projectDir}/../../../subprojects/demo-assets-1.05/assets")
        if (!assets.isDirectory()) {
            throw new GradleException(
                "Demo assets missing at ${assets}.\n" +
                "Fetch them with: meson subprojects download demo-assets")
        }
    }
}

// The native libraries (libSDL2.so, libmain.so) are prebuilt outside gradle:
// SDL2 via CMake+NDK and the game via the meson cross file (see
// android/README.md). They are picked up from app/src/main/jniLibs/arm64-v8a/.
